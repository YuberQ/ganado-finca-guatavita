  </nav>

  <!-- Main content -->
  <main class="main-content" id="main-content">
    <header class="top-bar" id="top-bar">
      <div class="top-bar__left">
        <button class="top-bar__hamburger" id="hamburger-btn" aria-label="Abrir menú">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
        </button>
        <h1 class="top-bar__title" id="page-title">Inventario Activo</h1>
      </div>
      <div class="top-bar__meta">
        FINCA ANGEL MARIA &bull; Uver Quintero
      </div>
    </header>

    <div class="page-content" id="page-content">
      <!-- Dynamic content rendered by JS -->
    </div>
  </main>

  <!-- Toast container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- SheetJS CDN -->
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>

  <!-- App -->
  <script type="module" src="js/app.js"></script>

  <!-- Mobile sidebar toggle -->
  <script>
    (function() {
      const hamburger = document.getElementById('hamburger-btn');
      const overlay = document.getElementById('sidebar-overlay');

      function toggleSidebar() {
        document.body.classList.toggle('sidebar-open');
      }

      function closeSidebar() {
        document.body.classList.remove('sidebar-open');
      }

      if (hamburger) hamburger.addEventListener('click', toggleSidebar);
      if (overlay) overlay.addEventListener('click', closeSidebar);

      document.querySelectorAll('.sidebar-link').forEach(function(link) {
        link.addEventListener('click', function() {
          if (window.innerWidth < 768) closeSidebar();
        });
      });
    })();
  </script>
</body>
</html>
