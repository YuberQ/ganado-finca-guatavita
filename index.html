<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — Finca Angel Maria</title>
  <style>
    :root {
      --farm-pine-dark: #16281a;
      --farm-cream: #f5f0e6;
      --font-display: 'Impact', 'Oswald', 'Franklin Gothic Medium', 'Arial Black', sans-serif;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-sans);
      background: linear-gradient(rgba(33, 26, 22, 0.65), rgba(33, 26, 22, 0.65)),
                  url('https://images.unsplash.com/photo-1500595046743-cd271d694d30?q=80&w=1600&auto=format&fit=crop') center/cover no-repeat;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Logo insignia principal */
    .brand-logo-container {
      margin-bottom: 20px;
      text-align: center;
    }

    .brand-logo-img {
      width: 220px;
      height: 220px;
      object-fit: cover;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6));
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      display: block;
      margin: 0 auto;
    }

    .login-card {
      width: 100%;
      background: #ffffff;
      border: 2px solid #211a16;
      box-shadow: 6px 6px 0px rgba(0, 0, 0, 0.35);
    }

    .login-header {
      background-color: var(--farm-pine-dark);
      color: #ffffff;
      padding: 16px 20px;
      text-align: center;
      border-bottom: 2px solid #000000;
    }

    .login-header__title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin: 0;
    }

    .login-body {
      padding: 28px 24px;
    }

    .login-group {
      margin-bottom: 20px;
    }

    .login-label {
      display: block;
      margin-bottom: 6px;
      font-family: var(--font-sans);
      font-weight: 800;
      font-size: 11px;
      color: #211a16;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .login-input {
      width: 100%;
      padding: 12px 14px;
      font-family: var(--font-sans);
      font-size: 14px;
      color: #211a16;
      border: 1px solid #211a16;
      background: #ffffff;
      border-radius: 0;
    }

    .login-input:focus {
      outline: none;
      border-color: var(--farm-pine-dark);
      box-shadow: inset 0 0 0 1px var(--farm-pine-dark);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--farm-pine-dark);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 900;
      border: 2px solid #000000;
      border-radius: 0;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: background-color 0.15s ease;
      margin-top: 8px;
    }

    .login-btn:hover {
      background-color: #233e28;
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-error {
      display: none;
      padding: 10px 14px;
      background-color: #fbeded;
      color: #7d1c1c;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 800;
      border: 1px solid #7d1c1c;
      margin-bottom: 16px;
    }

    .login-error.visible {
      display: block;
    }
  </style>
</head>
<body>
  <div class="login-wrapper">
    <!-- Logotipo Oficial HQ - Finca Angel Maria -->
    <div class="brand-logo-container">
      <img src="assets/logo-angel-maria.png" alt="Finca Angel Maria - HQ" class="brand-logo-img" />
    </div>

    <div class="login-card">
      <div class="login-header">
        <h2 class="login-header__title">Acceso al Sistema</h2>
      </div>

      <div class="login-body">
        <div id="login-error" class="login-error"></div>

        <form id="login-form">
          <div class="login-group">
            <label class="login-label" for="email">Correo Autorizado</label>
            <input
              class="login-input"
              type="email"
              id="email"
              name="email"
              placeholder="usuario@dominio.com"
              required
              autocomplete="email"
            >
          </div>

          <div class="login-group">
            <label class="login-label" for="password">Contraseña</label>
            <input
              class="login-input"
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            >
          </div>

          <button class="login-btn" type="submit" id="login-btn">
            Ingresar
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/auth.js"></script>

  <script type="module">
    import { login } from './js/auth.js';

    const form = document.getElementById('login-form');
    const errorDiv = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Verificando credenciales…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const { error } = await login(email, password);
        if (error) throw error;
        window.location.href = 'app.html';
      } catch (err) {
        errorDiv.textContent = err.message || 'Error al autenticar';
        errorDiv.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Ingresar';
      }
    });
  </script>
</body>
</html>
