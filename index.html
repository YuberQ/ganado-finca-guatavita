<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Sistema de Gestión Ganadera</title>
  <style>
    /* ── Variables inline for login page ── */
    :root {
      --green-900: #1a3c1a;
      --green-700: #2d5016;
      --green-500: #4a7c2e;
      --green-100: #d4e6c3;
      --brown-900: #3e2723;
      --brown-700: #5c3d2e;
      --brown-300: #d2b48c;
      --brown-100: #f5f0e8;
      --font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--brown-100);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      background: #ffffff;
      border: 2px solid var(--brown-300);
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.12);
      width: 100%;
      max-width: 420px;
      overflow: hidden;
    }

    .login-header {
      background-color: var(--green-700);
      padding: 32px 32px 24px;
      text-align: center;
      border-bottom: 3px solid var(--green-900);
    }

    .login-header__icon {
      font-size: 40px;
      margin-bottom: 8px;
      display: block;
    }

    .login-header__title {
      color: #ffffff;
      font-size: 22px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: 0.5px;
    }

    .login-header__subtitle {
      color: var(--green-100);
      font-size: 14px;
      font-weight: 500;
      margin-top: 6px;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .login-body {
      padding: 32px;
    }

    .login-group {
      margin-bottom: 20px;
    }

    .login-label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
      color: var(--brown-700);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .login-input {
      width: 100%;
      padding: 12px;
      font-family: var(--font-family);
      font-size: 16px;
      color: #2c2c2c;
      border: 2px solid var(--brown-300);
      background: #ffffff;
    }

    .login-input:focus {
      outline: none;
      border-color: var(--green-500);
      box-shadow: 0 0 0 3px rgba(45, 80, 22, 0.15);
    }

    .login-input::placeholder {
      color: #999;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background-color: var(--green-700);
      color: #ffffff;
      font-family: var(--font-family);
      font-size: 16px;
      font-weight: 700;
      border: 2px solid var(--green-900);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background-color 0.15s ease;
    }

    .login-btn:hover {
      background-color: var(--green-900);
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-error {
      display: none;
      padding: 12px;
      background-color: #ffebee;
      color: #c62828;
      font-size: 14px;
      font-weight: 600;
      border: 2px solid #c62828;
      margin-bottom: 16px;
    }

    .login-error.visible {
      display: block;
    }

    .login-footer {
      text-align: center;
      padding: 16px 32px;
      border-top: 2px solid var(--brown-300);
      background-color: var(--brown-100);
    }

    .login-footer__text {
      font-size: 13px;
      color: #757575;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <span class="login-header__icon">🐄</span>
      <h1 class="login-header__title">Sistema de Gestión Ganadera</h1>
      <p class="login-header__subtitle">Finca Guatavita</p>
    </div>

    <div class="login-body">
      <div id="login-error" class="login-error"></div>

      <form id="login-form">
        <div class="login-group">
          <label class="login-label" for="email">Correo electrónico</label>
          <input
            class="login-input"
            type="email"
            id="email"
            name="email"
            placeholder="usuario@ejemplo.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="login-group">
          <label class="login-label" for="password">Contraseña</label>
          <input
            class="login-input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <button class="login-btn" type="submit" id="login-btn">
          Iniciar Sesión
        </button>
      </form>
    </div>

    <div class="login-footer">
      <p class="login-footer__text">Uver Quintero — Finca Guatavita</p>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- App modules -->
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/auth.js"></script>

  <script type="module">
    import { login } from './js/auth.js';

    const form = document.getElementById('login-form');
    const errorDiv = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Ingresando…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        await login(email, password);
        window.location.href = 'app.html';
      } catch (err) {
        errorDiv.textContent = err.message || 'Error al iniciar sesión';
        errorDiv.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Iniciar Sesión';
      }
    });
  </script>
</body>
</html>
