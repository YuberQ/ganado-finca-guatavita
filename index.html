<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso — Finca Guatavita</title>
  <style>
    :root {
      --ink-black: #111111;
      --paper-cream: #fbf9f4;
      --paper-card: #ffffff;
      --green-900: #142817;
      --brown-700: #4a2e1d;
      --border-color: #2b2b2b;
      --font-serif: 'Georgia', 'Garamond', 'Times New Roman', serif;
      --font-sans: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-serif);
      background-color: var(--paper-cream);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--ink-black);
    }

    .login-card {
      background: var(--paper-card);
      border: 2px solid var(--ink-black);
      width: 100%;
      max-width: 440px;
    }

    .login-header {
      background-color: var(--green-900);
      color: #ffffff;
      padding: 28px 24px;
      text-align: center;
      border-bottom: 3px double #ffffff;
    }

    .login-header__title {
      font-family: var(--font-serif);
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    .login-header__subtitle {
      font-family: var(--font-sans);
      font-size: 11px;
      font-weight: 600;
      color: #d1dbc8;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 6px;
    }

    .login-body {
      padding: 32px 28px;
    }

    .login-group {
      margin-bottom: 20px;
    }

    .login-label {
      display: block;
      margin-bottom: 6px;
      font-family: var(--font-sans);
      font-weight: 700;
      font-size: 11px;
      color: var(--ink-black);
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .login-input {
      width: 100%;
      padding: 10px 12px;
      font-family: var(--font-sans);
      font-size: 14px;
      color: var(--ink-black);
      border: 1px solid var(--border-color);
      background: #ffffff;
      border-radius: 0;
    }

    .login-input:focus {
      outline: none;
      border-color: var(--green-900);
      box-shadow: inset 0 0 0 1px var(--green-900);
    }

    .login-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--green-900);
      color: #ffffff;
      font-family: var(--font-sans);
      font-size: 13px;
      font-weight: 700;
      border: 1px solid #000000;
      border-radius: 0;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background-color 0.1s ease;
      margin-top: 10px;
    }

    .login-btn:hover {
      background-color: #0b170d;
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .login-error {
      display: none;
      padding: 10px 14px;
      background-color: #fbeded;
      color: #8a1818;
      font-family: var(--font-sans);
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #8a1818;
      margin-bottom: 16px;
    }

    .login-error.visible {
      display: block;
    }

    .login-footer {
      text-align: center;
      padding: 12px 24px;
      border-top: 1px solid #e2ddd3;
      background-color: #f5f2ea;
    }

    .login-footer__text {
      font-family: var(--font-sans);
      font-size: 11px;
      color: #555555;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <h1 class="login-header__title">Finca Guatavita</h1>
      <p class="login-header__subtitle">Sistema de Control & Registro Ganadero</p>
    </div>

    <div class="login-body">
      <div id="login-error" class="login-error"></div>

      <form id="login-form">
        <div class="login-group">
          <label class="login-label" for="email">Correo Institucional / Autorizado</label>
          <input
            class="login-input"
            type="email"
            id="email"
            name="email"
            placeholder="usuario@dominio.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="login-group">
          <label class="login-label" for="password">Contraseña</label>
          <input
            class="login-input"
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <button class="login-btn" type="submit" id="login-btn">
          Ingresar al Sistema
        </button>
      </form>
    </div>

    <div class="login-footer">
      <p class="login-footer__text">Uver Quintero — Guatavita</p>
    </div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="module" src="js/config.js"></script>
  <script type="module" src="js/auth.js"></script>

  <script type="module">
    import { login } from './js/auth.js';

    const form = document.getElementById('login-form');
    const errorDiv = document.getElementById('login-error');
    const btn = document.getElementById('login-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.classList.remove('visible');
      btn.disabled = true;
      btn.textContent = 'Verificando credenciales…';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const { error } = await login(email, password);
        if (error) throw error;
        window.location.href = 'app.html';
      } catch (err) {
        errorDiv.textContent = err.message || 'Error al autenticar';
        errorDiv.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Ingresar al Sistema';
      }
    });
  </script>
</body>
</html>
